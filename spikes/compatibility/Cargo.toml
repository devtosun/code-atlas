[package]
name = "codeatlas-compatibility"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-full"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-std", "macros", "rt-multi-thread"] }
tree-sitter = "=0.27.0"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-dart = "=0.2.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
