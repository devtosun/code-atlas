[workspace]
members = [
    "crates/ca-cli",
    "crates/ca-core",
    "crates/ca-engine",
    "crates/ca-languages",
    "crates/ca-mcp",
    "crates/ca-storage",
    "xtask",
]
exclude = ["fuzz", "spikes/compatibility"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
blake3 = "=1.8.7"
ca-core = { version = "=0.1.0", path = "crates/ca-core" }
ca-engine = { version = "=0.1.0", path = "crates/ca-engine" }
ca-languages = { version = "=0.1.0", path = "crates/ca-languages" }
ca-mcp = { version = "=0.1.0", path = "crates/ca-mcp" }
ca-storage = { version = "=0.1.0", path = "crates/ca-storage" }
clap = { version = "=4.6.7", features = ["derive"] }
fs4 = "=1.1.0"
gix = { version = "=0.87.1", default-features = false, features = ["sha1"] }
ignore = "=0.4.33"
libc = "=0.2.189"
notify = "=8.2.0"
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-full"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-std", "macros", "rt-multi-thread"] }
toml_edit = "=0.25.15"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
tree-sitter = "=0.27.0"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-dart = "=0.2.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
