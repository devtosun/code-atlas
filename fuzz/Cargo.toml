[package]
name = "codeatlas-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
ca-core = { path = "../crates/ca-core" }
ca-engine = { path = "../crates/ca-engine" }
ca-languages = { path = "../crates/ca-languages" }
ca-mcp = { path = "../crates/ca-mcp" }
libfuzzer-sys = "=0.4.10"
serde_json = "=1.0.151"

[[bin]]
name = "parser_extraction"
path = "fuzz_targets/parser_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "boundary_decoders"
path = "fuzz_targets/boundary_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_arguments"
path = "fuzz_targets/tool_arguments.rs"
test = false
doc = false
bench = false
